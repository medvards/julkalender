<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julkalender 2026</title>
    
    <!-- Ladda in Tailwind CSS för all styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Snöfall animation */
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(20px); opacity: 0; }
        }
        .animate-fall {
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            position: absolute;
            color: white;
        }
        
        /* Skak-animation när en lucka är låst */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        
        /* Modalanimationer */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-scaleIn {
            animation: scaleIn 0.3s ease-out;
        }
        
        /* Hjälpklass för att dölja element */
        .hidden-el { display: none !important; }
        
        /* Anpassad scrollbar i modalfönstret */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c53030; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9b2c2c; }
    </style>
</head>

<body class="min-h-screen font-sans text-slate-900 relative bg-cover bg-center bg-fixed overflow-x-hidden" 
      style="background-image: url('https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=2069&auto=format&fit=crop')">
    
    <!-- Mörk overlay för läsbarhet mot den stämningsfulla bakgrunden -->
    <div class="fixed inset-0 bg-black/50 z-0 pointer-events-none"></div>

    <!-- Behållare för snöeffekten -->
    <div id="snow-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true"></div>

    <!-- Huvudinnehåll -->
    <main class="relative z-10 container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-10 mt-4">
            <h1 class="text-4xl md:text-6xl font-serif font-bold text-amber-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] mb-4">
                Julkalendern 2026
            </h1>
            <p class="text-red-50 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed drop-shadow-md font-medium">
                Välkommen att öppna en lucka varje dag fram till julafton! 
                Bakom varje lucka döljer sig en liten överraskning.
            </p>
        </header>

        <!-- Kalender Grid (fylls dynamiskt av JavaScriptet) -->
        <div id="calendar-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Luckor injiceras här -->
        </div>

        <!-- Footer -->
        <footer class="text-center mt-16 pb-8 text-gray-300 text-sm drop-shadow-md">
            <p>&copy; 2026 God Jul & Gott Nytt År</p>
        </footer>
    </main>

    <!-- Modal / Popup för luckans innehåll (dold som standard) -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn hidden-el">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden relative transform transition-all animate-scaleIn border-4 border-amber-400 flex flex-col max-h-[90vh]">
            
            <!-- Stäng-knapp -->
            <button onclick="closeModal()" class="absolute top-3 right-3 p-2 bg-black/50 hover:bg-red-600 rounded-full text-white transition-colors z-20 shadow-lg backdrop-blur-md" aria-label="Stäng lucka">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <!-- Media Container (Bild, YouTube, Spotify hamnar här) -->
            <div id="modal-media-container" class="relative bg-gray-900 w-full min-h-[200px] sm:min-h-[280px] flex-shrink-0 flex items-center justify-center">
                <!-- Media-innehåll injiceras hit av JavaScriptet -->
                
                <!-- Datum-titel över bild/media -->
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-4 pointer-events-none z-10">
                    <h2 id="modal-day-title" class="text-2xl font-bold text-white font-serif drop-shadow-md">
                        <!-- Fylls dynamiskt -->
                    </h2>
                </div>
            </div>

            <!-- Innehållssektion -->
            <div class="p-6 sm:p-8 text-center overflow-y-auto flex-grow">
                <h3 class="text-xl font-bold text-red-700 mb-3 font-serif uppercase tracking-wide">
                    Dagens Överraskning
                </h3>
                <p id="modal-text" class="text-gray-700 mb-6 leading-relaxed whitespace-pre-wrap">
                    <!-- Text fylls dynamiskt -->
                </p>

                <!-- Länk-knapp (visas endast om länk finns) -->
                <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden-el inline-flex items-center justify-center gap-2 bg-red-700 text-white px-6 py-3 rounded-full font-bold hover:bg-red-800 transition-transform hover:scale-105 shadow-lg active:scale-95 w-full sm:w-auto">
                    <span id="modal-link-text">Läs mer</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>
            </div>

            <div class="bg-green-800 h-2 w-full flex-shrink-0"></div>
        </div>
    </div>

    <script>
        // --- DATA FÖR ALLA 24 LUCKOR ---
        // Här lägger du in allt ditt innehåll. 
        // Välj mediaType: 'image', 'youtube' eller 'spotify'
        const calendarData = [];
        for (let i = 1; i <= 24; i++) {
            let mediaType = 'image';
            let mediaUrl = `https://placehold.co/600x400/165B33/FFF?text=Julbild+${i}`;
            
            // Exempel på hur man använder YouTube och Spotify (lucka 2 & 3)
            if (i === 2) {
                mediaType = 'youtube';
                mediaUrl = 'https://www.youtube.com/embed/j9jbdgZidu8';
            } else if (i === 3) {
                mediaType = 'spotify';
                mediaUrl = 'https://open.spotify.com/embed/track/0bYg9bo50gSsH3LtXe2SQn?utm_source=generator';
            }

            calendarData.push({
                day: i,
                mediaType: mediaType,
                mediaUrl: mediaUrl,
                text: `Här är ett mysigt julmeddelande eller en rolig utmaning för den ${i} december! Ha en underbar dag!`,
                link: "https://example.com",
                linkText: "Dagens erbjudande"
            });
        }

        // --- VARIABLER & TILLSTÅND ---
        let openedDoors = [];
        const gridContainer = document.getElementById('calendar-grid');
        const modalBackdrop = document.getElementById('modal-backdrop');

        // Starta kalendern när sidan har laddats
        window.addEventListener('DOMContentLoaded', () => {
            // Hämta sparade luckor från LocalStorage
            const savedDoors = localStorage.getItem('openedDoors2026');
            if (savedDoors) {
                openedDoors = JSON.parse(savedDoors);
            }
            
            createSnow();
            renderCalendar();
        });

        // Skapa den visuella snön
        function createSnow() {
            const container = document.getElementById('snow-container');
            for (let i = 0; i < 25; i++) {
                const flake = document.createElement('div');
                flake.className = 'absolute text-white opacity-70 animate-fall';
                flake.style.left = `${Math.random() * 100}%`;
                flake.style.top = `-${Math.random() * 20}%`;
                flake.style.animationDuration = `${Math.random() * 5 + 5}s`;
                flake.style.animationDelay = `${Math.random() * 5}s`;
                flake.style.fontSize = `${Math.random() * 15 + 10}px`;
                flake.innerHTML = '❄';
                container.appendChild(flake);
            }
        }

        // Bygg upp HTML för kalenderns grid
        function renderCalendar() {
            gridContainer.innerHTML = ''; // Rensa först
            
            const today = new Date();
            const currentMonth = today.getMonth(); // December är 11
            const currentDay = today.getDate();

            calendarData.forEach(item => {
                const isOpened = openedDoors.includes(item.day);
                // Kontrollera om låset ska visas
                // Om månaden är december, visa lås på framtida datum
                const isFutureDate = (currentMonth === 11 && item.day > currentDay) || currentMonth < 11;
                
                // Skapa knapp-elementet
                const btn = document.createElement('button');
                btn.id = `door-${item.day}`;
                btn.className = `aspect-square relative rounded-xl shadow-xl transition-all duration-300 transform border-2 focus:outline-none focus:ring-4 focus:ring-amber-400 group `;
                
                if (isOpened) {
                    btn.className += `bg-amber-100 border-amber-300 scale-95 opacity-90`;
                    btn.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-2">
                            <div class="text-green-700 opacity-20 absolute inset-0 flex items-center justify-center text-7xl sm:text-8xl font-bold pointer-events-none">${item.day}</div>
                            
                            <!-- Presentikon SVG -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600 z-10 mb-1 sm:mb-2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
                            
                            <span class="text-[10px] sm:text-xs font-bold text-red-800 z-10 uppercase tracking-wider">Öppnad</span>
                        </div>
                    `;
                } else {
                    btn.className += `bg-green-800 border-green-600 hover:bg-green-700 hover:scale-105 hover:rotate-1 hover:shadow-2xl hover:border-amber-400`;
                    
                    let lockHtml = '';
                    if (isFutureDate) {
                        lockHtml = `
                            <div class="absolute bottom-2 sm:bottom-3 text-green-900/50">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                        `;
                    }

                    btn.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full p-2 relative overflow-hidden">
                            <!-- Dekorativa hörn -->
                            <div class="absolute top-2 left-2 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-amber-400 rounded-full opacity-50"></div>
                            <div class="absolute top-2 right-2 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-amber-400 rounded-full opacity-50"></div>
                            <div class="absolute bottom-2 left-2 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-amber-400 rounded-full opacity-50"></div>
                            <div class="absolute bottom-2 right-2 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-amber-400 rounded-full opacity-50"></div>
                            
                            <!-- Blixtrande hovereffekt -->
                            <div class="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-colors duration-300"></div>

                            <span class="text-4xl md:text-5xl font-serif font-bold text-amber-50 drop-shadow-sm z-10">${item.day}</span>
                            ${lockHtml}
                        </div>
                    `;
                }

                // Klickhändelse
                btn.addEventListener('click', () => handleDoorClick(item, btn));
                gridContainer.appendChild(btn);
            });
        }

        // Hantera vad som händer när en lucka klickas
        function handleDoorClick(item, buttonElement) {
            const today = new Date();
            const currentMonth = today.getMonth(); // 11 = December
            const currentDay = today.getDate();

            // --- TEST/DEMO LÄGE ---
            // Om du vill kunna klicka på alla luckor direkt vid testning, 
            // ändra isAllowedDate till: const isAllowedDate = true;
            
            const isDecember = currentMonth === 11;
            const isAllowedDate = isDecember && item.day <= currentDay;

            // Har användaren redan öppnat denna?
            const isAlreadyOpened = openedDoors.includes(item.day);

            if (isAllowedDate || isAlreadyOpened) {
                // Spara att luckan är öppnad
                if (!isAlreadyOpened) {
                    openedDoors.push(item.day);
                    localStorage.setItem('openedDoors2026', JSON.stringify(openedDoors));
                    renderCalendar(); // Uppdatera UI:t så luckan blir "öppnad"
                }
                openModal(item);
            } else {
                // Om dagen inte har infallit än, skaka på knappen!
                buttonElement.classList.add('animate-shake');
                setTimeout(() => {
                    buttonElement.classList.remove('animate-shake');
                }, 500);
            }
        }

        // Öppna modalen med rätt innehåll
        function openModal(item) {
            // Sätt Titel och Text
            document.getElementById('modal-day-title').textContent = `${item.day} December`;
            document.getElementById('modal-text').textContent = item.text;

            // Hantera länk
            const linkEl = document.getElementById('modal-link');
            if (item.link) {
                linkEl.href = item.link;
                document.getElementById('modal-link-text').textContent = item.linkText || "Läs mer";
                linkEl.classList.remove('hidden-el');
            } else {
                linkEl.classList.add('hidden-el');
            }

            // Hantera Media (Bild, YouTube, Spotify)
            const mediaContainer = document.getElementById('modal-media-container');
            // Ta bort gammalt innehåll
            const existingMedia = mediaContainer.querySelector('.media-item');
            if (existingMedia) existingMedia.remove();

            if (item.mediaType === 'image') {
                const img = document.createElement('img');
                img.src = item.mediaUrl;
                img.alt = `Lucka ${item.day}`;
                img.className = "media-item absolute inset-0 w-full h-full object-cover";
                // Fallback om bilden inte laddas
                img.onerror = function() {
                    this.src = 'https://placehold.co/600x400/D42426/FFF?text=God+Jul';
                };
                mediaContainer.insertBefore(img, mediaContainer.firstChild);
            
            } else if (item.mediaType === 'youtube') {
                const iframe = document.createElement('iframe');
                iframe.src = item.mediaUrl;
                iframe.className = "media-item absolute inset-0 w-full h-full";
                iframe.setAttribute("frameborder", "0");
                iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
                iframe.setAttribute("allowfullscreen", "true");
                mediaContainer.insertBefore(iframe, mediaContainer.firstChild);
            
            } else if (item.mediaType === 'spotify') {
                const iframe = document.createElement('iframe');
                iframe.src = item.mediaUrl;
                iframe.className = "media-item absolute inset-0 w-full h-full";
                iframe.setAttribute("frameborder", "0");
                iframe.setAttribute("allow", "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture");
                mediaContainer.insertBefore(iframe, mediaContainer.firstChild);
            }

            // Visa modal
            modalBackdrop.classList.remove('hidden-el');
            document.body.style.overflow = 'hidden'; // Stoppa scrollning av bakgrunden
        }

        // Stäng modalen
        function closeModal() {
            modalBackdrop.classList.add('hidden-el');
            document.body.style.overflow = 'auto'; // Tillåt scrollning igen

            // Viktigt: Rensa media-containern så att filmer/musik slutar spelas!
            const existingMedia = document.getElementById('modal-media-container').querySelector('.media-item');
            if (existingMedia) {
                existingMedia.remove();
            }
        }

        // Stäng modalen om man klickar utanför den vita rutan
        modalBackdrop.addEventListener('click', function(event) {
            if (event.target === modalBackdrop) {
                closeModal();
            }
        });
    </script>
</body>
</html>
